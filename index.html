<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" type="text/css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Decodificador de Textos</title>
  </head>

  <body>
    <header>
      <a
        href="https://cursos.alura.com.br/dashboard"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="logotipo"
          src="./assets/img/logo.svg"
          alt="Imagem do logo da Alura"
          title="Acesse o site da Alura"
        />
      </a>
    </header>

    <main>
      <section class="sessao-entrada">
        <textarea class="input-text" placeholder="Digite seu texto"></textarea>
        <h6 class="alerta">! Apenas letras minúsculas e sem acento.</h6>
        <div class="entrada">
          <button class="btn-criptografar">Criptografar</button>
          <button class="btn-decriptografar">Decriptografar</button>
          <button class="btn-limpar">Limpar</button>
        </div>
      </section>

      <section class="sessao-saida">
        <div class="retorno">
          <img
            class="mensagem"
            src="./assets/img/avatar.svg"
            alt="Imagem de um boneco com uma lupa sobre um diamante"
            title="Avatar"
          />
          <h3 class="mensagem">Nenhuma mensagem encontrada</h3>
          <p class="mensagem">
            Digite o texto que você deseja criptografar ou decriptografar.
          </p>
        </div>
        <button class="btn-copiar" style="display: none">Copiar</button>
      </section>
    </main>

    <script src="./assets/js/script.js"></script>

    <footer class="rodape">
      <div class="credito">
        <div class="credito-mensagem">
          <small>🕶 Desenvolvido por Marcelo Soares ™.</small>
          <div class="redes-sociais">
            <div class="redes-sociais-links">
              <ul>
                <li>
                  <a
                    href="https://www.linkedin.com/in/marcelodsoares/"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Acesse meu LinkedIn"
                  >
                    <img src="assets/img/linkedin.svg" alt="LinkedIn" />
                  </a>
                </li>
                <li>
                  <a
                    href="https://github.com/Mdsoare"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="Acesse meu GitHub"
                  >
                    <img src="assets/img/github.svg" alt="GitHub" />
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
